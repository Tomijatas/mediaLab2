<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Lab2 - VR application</title>

  <!-- NAUJA A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    let model = null;
    let currentModel = 0;

    window.addEventListener('DOMContentLoaded', () => {
      model = document.querySelector('#model');
    });

    function rotate() {
      if (!model) return;

      let rot = model.getAttribute('rotation');
      model.setAttribute('rotation', {
        x: rot.x,
        y: rot.y + 20,
        z: rot.z
      });
    }

    function move() {
      if (!model) return;

      let pos = model.getAttribute('position');
      model.setAttribute('position', {
        x: pos.x + 0.3,
        y: pos.y,
        z: pos.z
      });
    }

    function zoomIn() {
      if (!model) return;

      let scale = model.getAttribute('scale');
      model.setAttribute('scale', {
        x: scale.x + 0.05,
        y: scale.y + 0.05,
        z: scale.z + 0.05
      });
    }

    function zoomOut() {
      if (!model) return;

      let scale = model.getAttribute('scale');

      if (scale.x > 0.05) {
        model.setAttribute('scale', {
          x: scale.x - 0.05,
          y: scale.y - 0.05,
          z: scale.z - 0.05
        });
      }
    }

    function loadObject() {
      if (!model) return;

      if (currentModel === 0) {
        model.setAttribute('color', 'blue');
        currentModel = 1;
      } else {
        model.setAttribute('color', 'red');
        currentModel = 0;
      }
    }
  </script>
</head>

<body>
  <a-scene>

    <a-sky color="#0f172a"></a-sky>

    <a-plane rotation="-90 0 0" width="50" height="50" color="#7c7c7c"></a-plane>

    <a-light type="ambient" intensity="1"></a-light>

    <!-- VIENAS MODELIS -->
    <a-box id="model"
           position="0 1 -3"
           rotation="0 45 0"
           color="red">
    </a-box>

  </a-scene>

  <div style="position: fixed; top: 10px; left: 10px; z-index: 999;">
    <button onclick="rotate()">Rotate</button>
    <button onclick="move()">Move</button>
    <button onclick="zoomIn()">Zoom In</button>
    <button onclick="zoomOut()">Zoom Out</button>
    <button onclick="loadObject()">Change color</button>
  </div>

</body>

</html>
